spring.application.name=praticalTestBE

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=${MYSQL_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:practical_test}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${MYSQLUSER:${MYSQL_USER:${SPRING_DATASOURCE_USERNAME:root}}}
spring.datasource.password=${MYSQLPASSWORD:${MYSQL_PASSWORD:${SPRING_DATASOURCE_PASSWORD:root}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false